# Local DEVELOPMENT database only. Production runs MariaDB natively on the VM.
# Docs: README.md
services:
  mariadb:
    image: mariadb:11.4
    container_name: socioecon-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: dev_root_password
      MARIADB_DATABASE: socioecon
    ports:
      - "127.0.0.1:3307:3306"   # loopback only; 3307 avoids clashing with a local MySQL/MariaDB
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/dev/02_dev_users.sql:/docker-entrypoint-initdb.d/02_dev_users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
