# /etc/nginx/sites-available/socioecon  (replace dash.example.gov.in, cert paths)
# nginx serves the built SPA and proxies /api to the Node API on loopback.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name dash.example.gov.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dash.example.gov.in;

    ssl_certificate     /etc/letsencrypt/live/dash.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.example.gov.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Chart.js draws on <canvas>; no inline scripts, no third-party origins.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    root /var/www/socioecon;          # contents of frontend/dist
    index index.html;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Forwarded-For $remote_addr;   # API runs with TRUST_PROXY=1
        proxy_read_timeout 15s;
    }

    location /assets/ {                # hashed filenames: cache forever
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {                       # SPA fallback
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
