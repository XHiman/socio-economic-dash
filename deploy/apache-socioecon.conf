# Add this INSIDE the existing <VirtualHost *:443> (and the :80 one only if the site is also served over http)
# that already serves nada (/, /index.php, /editor) and /bill. Existing directives stay untouched.
#
# One-time module check (usually already on):  sudo a2enmod proxy proxy_http headers
#
# Static files :  /var/www/socioecon-site/Dashboard/Socio-Economic/   (contents of frontend/dist)
# API (Node)   :  127.0.0.1:3005   (systemd service socioecon-api, PORT=3005 in api.env)

# --- API: /Dashboard/Socio-Economic/api/x  ->  http://127.0.0.1:3005/api/x -------------------------
ProxyPass        /Dashboard/Socio-Economic/api/ http://127.0.0.1:3005/api/ timeout=15
ProxyPassReverse /Dashboard/Socio-Economic/api/ http://127.0.0.1:3005/api/
<Location /Dashboard/Socio-Economic/api/>
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}   # API runs with TRUST_PROXY=1
</Location>

# --- Frontend (single-page app) ------------------------------------------------------------------
# Kept outside the existing DocumentRoot so nada's .htaccess / PHP rules never apply to it.
Alias /Dashboard/Socio-Economic /var/www/socioecon-site/Dashboard/Socio-Economic
<Directory /var/www/socioecon-site/Dashboard/Socio-Economic>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    # Deep links like /Dashboard/Socio-Economic/district/11 fall back to the app shell.
    FallbackResource /Dashboard/Socio-Economic/index.html

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    # Chart.js draws on <canvas>; no inline scripts, no third-party origins.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
</Directory>
# Hashed build files: cache forever, and a missing one must be a real 404, not the app shell.
<Directory /var/www/socioecon-site/Dashboard/Socio-Economic/assets>
    FallbackResource disabled
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
